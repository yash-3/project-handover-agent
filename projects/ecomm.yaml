# Per-project config. Secrets are env references only (${VAR}); literals are rejected.
name: ecomm
languages: [java]
repos:
  - id: order-service
    type: github
    url: https://github.com/CHANGE-ME/ecomm-order-service
    branch: main
    auth: ${GITHUB_TOKEN}
    paths:
      include: ["src/**", "docs/**", "deploy/**"]
      exclude: ["**/test/**"]
ci:
  type: github-actions
  url: https://github.com/CHANGE-ME/ecomm/actions
  auth: ${GITHUB_TOKEN}
deploy:
  manifests: { repo: order-service, paths: ["deploy/**", "helm/**"] }
  environments: [dev, staging, prod]
tickets:
  type: github-issues
  url: https://github.com/CHANGE-ME/ecomm/issues
  auth: ${GITHUB_TOKEN}
docs:
  sources:
    - { type: folder, path: docs/ }
domain:
  vocabulary: {}
llm:
  workerModel: claude-haiku-5-5
  orchestratorModel: claude-sonnet-5-5
  maxTokensPerRun: 400000
handover:
  template: templates/default.md
  outputDir: outputs/ecomm
  approvalRequired: true
guardrails:
  piiMasking: true
  allowedTools: readOnly
