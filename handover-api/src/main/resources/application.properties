# Local-only by default. Put a TLS-terminating reverse proxy in front before exposing this anywhere else.
#server.address=127.0.0.1
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.main.banner-mode=off

# Required: the API refuses to start without a key of at least 16 characters (never commit a real one).
handover.api-key=${HANDOVER_API_KEY:}
handover.projects-dir=${HANDOVER_PROJECTS_DIR:projects}
